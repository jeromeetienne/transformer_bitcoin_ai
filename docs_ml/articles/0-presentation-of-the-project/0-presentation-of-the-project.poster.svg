<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" width="1200" height="627">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101b30"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="627" fill="url(#bg)"/>
  <!-- subtle horizontal grid -->
  <g stroke="#1c2a44" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="220" x2="1200" y2="220"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="520" x2="1200" y2="520"/>
  </g>
  <!-- motif: BTC price line drifting upward in the background -->
  <g opacity="0.18" stroke="#f7931a" stroke-width="3" fill="none">
    <polyline points="60,450 130,430 200,460 270,410 340,420 410,380 480,400 550,360 620,330 690,350 760,300 830,310 900,260 970,280 1040,220 1110,200 1140,210"/>
  </g>
  <!-- ladder of model dots -->
  <g opacity="0.45">
    <circle cx="80" cy="555" r="4" fill="#94a3b8"/>
    <circle cx="240" cy="555" r="4" fill="#94a3b8"/>
    <circle cx="400" cy="555" r="4" fill="#94a3b8"/>
    <circle cx="560" cy="555" r="4" fill="#94a3b8"/>
    <circle cx="720" cy="555" r="4" fill="#94a3b8"/>
    <circle cx="880" cy="555" r="4" fill="#94a3b8"/>
    <circle cx="1040" cy="555" r="4" fill="#94a3b8"/>
    <circle cx="1120" cy="555" r="5" fill="#f7931a"/>
    <line x1="80" y1="555" x2="1120" y2="555" stroke="#475569" stroke-width="1"/>
  </g>
  <!-- series tag -->
  <text x="72" y="100" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="600" letter-spacing="3" fill="#f7931a">BITCOIN ML SERIES &#8226; ARTICLE 0 OF 7</text>
  <!-- title -->
  <text x="72" y="220" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="76" font-weight="800" fill="#f5f7fb">Can Machine Learning</text>
  <text x="72" y="305" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="76" font-weight="800" fill="#f5f7fb">Predict Bitcoin?</text>
  <!-- subtitle -->
  <text x="72" y="385" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="500" fill="#cbd5e1">Seven models, one data slice, one honest scoreboard.</text>
  <text x="72" y="430" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="500" fill="#cbd5e1">From naive last-value to fine-tuned foundation models.</text>
  <!-- footer -->
  <text x="72" y="595" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="500" fill="#64748b">jerome etienne &#8226; github.com/jeromeetienne/transformer_bitcoin_ai</text>
</svg>
