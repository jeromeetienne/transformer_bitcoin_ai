# 4h BTCUSDT spot, calendar year 2024 (through end of November).
# Splits at clean month boundaries; ratio ≈ 8:1:2 (train:val:test) mirrors the
# previous test_fraction=0.2, val_fraction=0.1 setup but with explicit dates.
# All boundaries are UTC, [start, end) — start inclusive, end exclusive.

source:                   # one Binance Vision pull covers all splits
  market: spot            # 'spot' | 'futures/um' | 'futures/cm'
  symbol: BTCUSDT         # Binance trading pair
  interval: 4h            # kline interval: 1m, 5m, 15m, 1h, 4h, 1d, ...
  period: monthly         # 'monthly' or 'daily'. Binance Vision archive granularity.

splits:
  train:      { start: 2024-01-01, end: 2024-09-01 }   # 8 months
  validation: { start: 2024-09-01, end: 2024-10-01 }   # 1 month — early-stopping for 04/05
  test:       { start: 2024-10-01, end: 2024-12-01 }   # 2 months — held out for evaluation
