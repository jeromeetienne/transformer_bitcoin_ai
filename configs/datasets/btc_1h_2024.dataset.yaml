# 1h BTCUSDT spot, calendar year 2024 (through end of November).
# Splits at clean month boundaries; ratio 7:2:2 (train:validation:test).
# All boundaries are UTC, [start, end) — start inclusive, end exclusive.
# Lag / rolling features at the first bar of validation or test legitimately
# read history from the previous slice — that's the walk-forward setup, not
# leakage, and the bars themselves never cross.

training:
  - market: spot           # Binance market: 'spot' | 'futures/um' | 'futures/cm'
    symbol: BTCUSDT        # Binance trading pair
    interval: 1h           # kline interval (must match every other selector in this file)
    period: monthly        # Binance Vision archive granularity: 'monthly' or 'daily'
    start: 2023-01-01      # UTC, inclusive
    end:   2024-08-01      # UTC, exclusive — 7 months of training bars

validation:
  - market: spot           # Binance market
    symbol: BTCUSDT        # Binance trading pair
    interval: 1h           # kline interval (must equal training interval)
    period: monthly        # Binance Vision archive granularity
    start: 2024-08-01      # UTC, inclusive
    end:   2024-10-01      # UTC, exclusive — 2 months, early-stopping signal for 04/05/07

test:
  - market: spot           # Binance market
    symbol: BTCUSDT        # Binance trading pair
    interval: 1h           # kline interval (must equal training interval)
    period: monthly        # Binance Vision archive granularity
    start: 2024-10-01      # UTC, inclusive
    end:   2024-12-01      # UTC, exclusive — 2 months held out for evaluation
