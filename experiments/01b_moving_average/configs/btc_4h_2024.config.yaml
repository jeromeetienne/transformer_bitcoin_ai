# Simple moving-average baseline — predicts close[t] = mean(close[t-window : t]).
# Sibling of 01_baseline_naive. Uses the same data slice; only the predictor differs.
# A window of 1 degenerates to naive last-value (sanity check).

dataset: btc_4h_2024     # → configs/datasets/btc_4h_2024.dataset.yaml
window: 6               # MA window size, in bars. 6 = one day for 4h data.
