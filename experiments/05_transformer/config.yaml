# Darts TFT (Temporal Fusion Transformer) on 1h BTC log-returns. The target is the
# bar-T log-return r_T = log(close_T / close_{T-1}); past covariates feed only data
# observed before T (darts slices past_covariates strictly before each forecast step,
# so no current-bar leakage). TFT additionally consumes future_covariates: cyclical
# encodings of hour-of-day and day-of-week, which are deterministic and known at any
# future timestamp. Predictions are reconstructed to price as
# close_pred = close_{T-1} * exp(r_pred) so MAE/RMSE/MAPE/dir_acc/Sharpe are directly
# comparable to 01/01b/02/03/04.

symbol: BTCUSDT       # Binance trading pair
interval: 1h          # kline interval: 1m, 5m, 15m, 1h, 4h, 1d, ...
start: 2024-01-01     # inclusive, UTC
end: 2024-12-01       # exclusive, UTC
period: monthly       # 'monthly' or 'daily'. Must be set explicitly.
                      # Use 'daily' for partial / not-yet-complete months.
test_fraction: 0.2    # tail fraction of the loaded series held out for evaluation

covariates:
  use_volume: true            # include log1p(volume) as a past covariate
  use_ohlc: true              # include (high-low) range and (close-open) body as past covariates
  use_time_features: true     # include hour_sin/hour_cos/dow_sin/dow_cos as FUTURE covariates

model:
  input_chunk_length: 48        # bars of history fed to the transformer (48h = 2 days)
  output_chunk_length: 1        # one-step-ahead forecast horizon
  hidden_size: 32               # transformer hidden dim (TFT main width)
  lstm_layers: 1                # depth of TFT's encoder/decoder LSTM stack
  num_attention_heads: 4        # multi-head self-attention heads
  dropout: 0.1                  # dropout across transformer blocks
  hidden_continuous_size: 8     # GRN size for continuous covariate processing
  add_relative_index: false     # we provide real future_covariates instead
  full_attention: false         # use TFT's interpretable masked attention
  batch_size: 64                # mini-batch size during training
  n_epochs: 30                  # max passes; early stopping may halt sooner
  learning_rate: 0.001          # Adam learning rate
  random_state: 42              # determinism for reproducible runs

training:
  val_fraction: 0.1             # tail fraction of the *training* slice carved off for early stopping
  early_stopping_patience: 5    # epochs of no val_loss improvement before stopping
