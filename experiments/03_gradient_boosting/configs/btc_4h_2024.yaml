# XGBoost on engineered features (lagged log-returns + rolling stats + OHLCV).
# Target is the bar-T log-return r_T = log(close_T / close_{T-1}); every feature
# uses only information observed strictly before T (no current-bar leakage).
# Predictions are reconstructed to price as close_pred = close_{T-1} * exp(r_pred)
# so MAE/RMSE/MAPE/dir_acc are directly comparable to 01/01b/02.

symbol: BTCUSDT       # Binance trading pair
interval: 4h          # kline interval: 1m, 5m, 15m, 1h, 4h, 1d, ...
start: 2024-01-01     # inclusive, UTC
end: 2024-12-01       # exclusive, UTC
period: monthly       # 'monthly' or 'daily'. Must be set explicitly.
                      # Use 'daily' for partial / not-yet-complete months.
test_fraction: 0.2    # tail fraction of the loaded series held out for evaluation

features:
  return_lags: 24            # number of lagged log-returns: r_{T-1}, r_{T-2}, ..., r_{T-N}
  rolling_windows: [6, 24]   # window sizes (in bars) for rolling mean/std of past log-returns
  use_volume: true           # include log1p(volume_{T-1}) as a feature
  use_ohlc: true             # include (high-low) range and (close-open) body of bar T-1

model:
  n_estimators: 400          # number of boosting rounds (trees)
  max_depth: 5               # max depth per tree; 3-8 is the usual range for tabular GB
  learning_rate: 0.05        # shrinkage; smaller needs more trees but generalizes better
  subsample: 0.8             # row sub-sampling per tree (stochastic GB)
  colsample_bytree: 0.8      # column sub-sampling per tree
  reg_lambda: 1.0            # L2 regularization on leaf weights
  random_state: 42           # determinism for reproducible runs
