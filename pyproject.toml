[project]
name = "btc-ai"
version = "0.1.0"
description = "Bitcoin price-prediction experiments (baselines, ARIMA, transformers)"
readme = "README.md"
authors = [
    { name = "Jerome Etienne", email = "jerome.etienne@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "darts[torch]>=0.43.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "optuna>=4.0.0",
    "optuna-dashboard>=0.16.0",
    "pandas>=3.0.2",
    "pyarrow>=24.0.0",
    "pyyaml>=6.0.3",
    "requests>=2.33.1",
    "scikit-learn>=1.8.0",
    "statsmodels>=0.14.6",
    "xgboost>=3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/btc_ai"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
